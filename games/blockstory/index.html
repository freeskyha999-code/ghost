<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>方块叙事引擎</title>
<style>
:root{--ink:#fff;--panel:rgba(12,12,18,.78);--line:#d7c9a0;--accent:#ffd66b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:15px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;text-shadow:1px 1px 0 #000}
#cross{left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#quest{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 10px;background:var(--panel);border-left:3px solid var(--accent);display:none;max-width:60vw}
#toast{left:12px;top:calc(env(safe-area-inset-top,0px) + 70px);max-width:70vw}
#toast div{background:var(--panel);padding:3px 8px;margin-top:3px}
#title{left:0;right:0;top:22%;text-align:center;opacity:0;transition:opacity .6s}
#title h1{margin:0;font-size:min(9vw,56px);letter-spacing:.2em;color:var(--accent)}
#title p{margin:6px 0 0;font-size:min(4vw,20px)}
#prompt{left:50%;top:58%;transform:translateX(-50%);display:none;background:var(--panel);padding:4px 12px}
#help{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:12px;opacity:.7;text-align:right}
#hotbar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:3px;padding:3px;background:var(--panel);pointer-events:auto}
#hotbar canvas{position:static;width:34px;height:34px;image-rendering:pixelated;border:2px solid #555;display:block}
#hotbar canvas.on{border-color:#fff}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:min(92vw,760px);background:var(--panel);border:2px solid var(--line);padding:10px 14px;display:none;min-height:84px;z-index:5}
#nm{color:var(--accent);font-weight:700}#tx{min-height:3em;white-space:pre-wrap}
#dlg i{position:absolute;right:10px;bottom:4px;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
#choices{position:fixed;left:50%;transform:translateX(-50%);top:30%;width:min(86vw,520px);display:none;flex-direction:column;gap:8px;z-index:6}
#choices button{font:inherit;color:#fff;background:var(--panel);border:2px solid var(--line);padding:10px;cursor:pointer;text-align:left}
#choices button:hover{border-color:var(--accent)}
#touch{display:none}.t #touch{display:block}
#look{position:fixed;right:0;top:0;width:60vw;height:100%}
#joy{position:fixed;left:0;bottom:0;width:42vw;height:50vh}
.b{position:fixed;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:24px}
#xyz{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font:11px ui-monospace,monospace;opacity:.75}
#sm{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:7;background:var(--panel);padding:3px 8px;font-size:12px;cursor:pointer;border:1px solid var(--line)}
#ed{position:fixed;inset:0;background:rgba(5,6,10,.94);display:none;z-index:20;align-items:center;justify-content:center;padding:10px}
.edb{width:min(96vw,900px);height:min(92vh,720px);display:flex;flex-direction:column;gap:8px}
#edt{flex:1;background:#0c0d12;color:#e8e8ee;border:1px solid var(--line);font:12px/1.5 ui-monospace,monospace;padding:10px;resize:none;user-select:text;-webkit-user-select:text;touch-action:auto}
.edr{display:flex;gap:6px;flex-wrap:wrap}.edr button,.edbtn{font:inherit;font-size:13px;color:#fff;background:var(--panel);border:1px solid var(--line);padding:8px 11px;cursor:pointer}
#edui{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;flex-direction:column;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none}
#edui>*{pointer-events:auto}
#edbar,#edpal{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--panel)}
#edbar button,.er button{font:inherit;font-size:13px;white-space:nowrap;color:#fff;background:#222633;border:1px solid var(--line);padding:9px 11px;border-radius:6px}
#edbar button.on{background:var(--accent);color:#000}
#edpal canvas{width:34px;height:34px;flex:none;image-rendering:pixelated;border:2px solid #555;background:#222}#edpal canvas.on{border-color:#fff}
#edhint{align-self:flex-start;background:var(--panel);padding:4px 10px;font-size:13px}
#ednpc{display:none;flex-direction:column;gap:6px;background:var(--panel);padding:10px;border:1px solid var(--line);max-height:42vh;overflow:auto;align-self:flex-start;width:min(92vw,420px)}
.er{display:flex;gap:6px}.er input{flex:1;min-width:0;font:inherit;padding:7px;background:#0c0d12;color:#fff;border:1px solid var(--line);user-select:text;-webkit-user-select:text}
#edback{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:9;display:none;background:var(--panel);padding:6px 12px;border:1px solid var(--accent);cursor:pointer}
#edmsg{color:var(--accent);font-size:12px;margin-left:8px}
#back{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:7;color:#fff;font-size:12px;background:var(--panel);padding:3px 8px;text-decoration:none;opacity:.85}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="cross"></div><div class="hud" id="quest"></div><div class="hud" id="toast"></div>
<div class="hud" id="title"><h1></h1><p></p></div><div class="hud" id="prompt"></div>
<div class="hud" id="help">WASD 移动 · 空格 跳 · 左键 破坏 · 右键 放置/交谈 · E 交谈 · 1-9 切换方块 · M 静音 · F 飞行 · P 剧本</div>
<div class="hud" id="hotbar"></div><div class="hud" id="xyz"></div><div id="sm" onclick="ED.enter()">🎬 剧本模式</div>
<div id="touch"><div id="look"></div><div id="joy"></div>
<div class="b" id="bJ" style="right:18px;bottom:96px">⬆</div><div class="b" id="bB" style="right:88px;bottom:56px">⛏</div><div class="b" id="bP" style="right:18px;bottom:170px">🧱</div></div>
<div id="dlg"><div id="nm"></div><div id="tx"></div><i>▼</i></div><a id="back" href="../../">← 游戏库</a>
<div id="choices"></div>
<div id="edui"><div id="edhint"></div><div id="ednpc"></div><div id="edpal"></div><div id="edbar"></div></div><div id="edback" onclick="ED.enter()">■ 返回编辑</div><div class="b" id="bD" style="display:none;right:88px;bottom:126px">⬇</div>
<div id="ed"><div class="edb"><div><b>剧本模式</b><span id="edmsg">改 JSON 即改剧情：npcs / triggers / scripts。按 ▶ 运行立即生效</span></div><textarea id="edt" spellcheck="false"></textarea><div class="edr" id="edr1"></div><div class="edr" id="edr2"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* 游戏代码按顺序加载（时间戳防缓存，改了代码刷新即生效） */
["util", "skins-custom", "atlas", "world", "render", "model", "npc", "ui", "story", "input", "loop", "story-data", "editor-json", "editor", "assets", "main"].forEach(n=>document.write('<script src="js/'+n+'.js?'+(+new Date)+'"><\/script>'));
</script>
</body></html>
