<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>两层别墅 · 我的世界场景</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ch{position:fixed;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;image-rendering:pixelated;pointer-events:none;mix-blend-mode:difference}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:#1d2a1d;z-index:5}
.ov h1{margin:0 0 6px;font-size:26px;letter-spacing:2px}.ov p{margin:4px 0;color:#b9c9b0;font-size:13px;line-height:1.6;max-width:420px;padding:0 16px}
#go{display:none;margin-top:14px;padding:12px 38px;font-size:17px;color:#fff;background:#5b8731;border:3px solid #a2c97a;border-bottom-color:#3b5a1d;border-right-color:#3b5a1d;cursor:pointer}
#ld{margin-top:14px;color:#a2c97a;font-size:14px}
.b{position:fixed;width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.32);color:#fff;font-size:15px;z-index:3;padding:0;-webkit-tap-highlight-color:transparent}
#bj{right:calc(26px + env(safe-area-inset-right));bottom:30px}#bu{right:calc(104px + env(safe-area-inset-right));bottom:62px}#bs{right:calc(26px + env(safe-area-inset-right));top:18px;width:46px;height:46px;font-size:20px}
#bf{display:none;right:calc(26px + env(safe-area-inset-right));bottom:106px;font-size:24px}
#tt{position:fixed;left:50%;top:14%;transform:translateX(-50%);max-width:70%;padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;z-index:4}
#back{position:fixed;left:calc(14px + env(safe-area-inset-left));top:14px;z-index:3;color:#fff;font-size:13px;text-decoration:none;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:14px}
#jr{display:none;position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);z-index:2;pointer-events:none}
#jk{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
#rot{display:none;z-index:9}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<img id="ch" src="assets/ui/crosshair.png" alt="">
<a id="back" href="../../">← 游戏库</a>
<div id="jr"><div id="jk"></div></div>
<button class="b" id="bj">跳</button>
<button class="b" id="bu">开关</button>
<button class="b" id="bs">☀</button>
<button class="b" id="bf">🔦</button>
<div id="tt"></div>
<div class="ov" id="st">
  <h1>两层别墅</h1>
  <p>原版方块搭建的两层小别墅，院子里有小路、花草和树。</p>
  <p>左半屏拖动行走，右半屏拖动转视角；对准门点「开关」可开关门，右上角切换昼夜。</p>
  <div id="ld">载入中…</div>
  <button id="go">进入别墅</button>
</div>
<div class="ov" id="rot"><h1>请横屏使用</h1><p>把手机转成横向，画面会自动适配。</p></div>
<script src="engine.js"></script>
<script src="mine.js"></script>
<script src="villa.js"></script>
<script>boot();</script>
</body>
</html>
