<div class=ov id=ov><h1>捉　鬼</h1>
<p>先慢慢转一圈，让手机扫描房间。</p>
<p>鬼躲在房间最暗的地方。你不看它，它就靠近。你看着它，它不动。</p>
<p>把准星对准它，盯住，直到圆环满。它会躲开两次。</p>
<p>它碰到你，你掉一条命。一共三条命，三只鬼。</p>
<p>需要相机和陀螺仪。戴耳机，能听出它在哪个方向。</p>

const gg=X.createRadialGradient(gx,gy,0,gx,gy,M.min(W,H)*.45);gg.addColorStop(0,`rgba(150,0,0,${.55*p2*pu})`);gg.addColorStop(1,'rgba(150,0,0,0)');X.fillStyle=gg;X.fillRect(0,0,W,H)}

let al=g.al*M.max(.35,M.min(1,1.25-g.D/12))*(q>.72?M.max(.35,1-(q-.72)*1.8):1)*(M.random()<.03*(g.D<5?1:.3)?.25:1);

drawG(g.pose,ft,hd,al,0);X.restore()}
aud(B,pr,t)}
