<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>GHOST 游戏库</title>
<style>
:root{color-scheme:dark;--bg:#0c0c12;--panel:#171722;--line:#2d2d40;--text:#f4f4fb;--muted:#aaaabd;--accent:#9d78ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#25203a 0,#101018 48%,#09090d 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100% - 32px,1000px);margin:0 auto;padding:56px 0 40px}
header{text-align:center;margin-bottom:36px}
.logo{display:inline-grid;place-items:center;width:68px;height:68px;border:1px solid #51416f;border-radius:22px;background:#211b32;font-size:34px;box-shadow:0 12px 40px #0006}
h1{font-size:clamp(32px,7vw,52px);margin:16px 0 8px;letter-spacing:2px}
.subtitle{color:var(--muted);margin:0;font-size:15px}
.section-title{font-size:18px;margin:0 0 16px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.card{display:flex;flex-direction:column;min-height:250px;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1d1d2b,#13131c);box-shadow:0 12px 32px #0002;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#65518b}
.art{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#2a2035;font-size:30px;margin-bottom:18px}
.card h3{font-size:21px;margin:0 0 8px}
.card p{color:var(--muted);line-height:1.6;margin:0 0 20px;font-size:14px}
.actions{margin-top:auto}
a.button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 16px;border-radius:12px;background:var(--accent);color:#120c20;text-decoration:none;font-weight:750}
a.button:hover{filter:brightness(1.1)}
a.button.secondary{background:#252535;color:var(--text);border:1px solid #39394d}
.tag{display:inline-block;font-size:12px;color:#d7c9ff;background:#322747;border:1px solid #4b3969;border-radius:99px;padding:4px 9px;margin-bottom:10px}
footer{text-align:center;color:#77778c;font-size:12px;margin-top:34px}
</style>
</head>
<body>
<main>
<header>
<div class="logo" aria-hidden="true">🎮</div>
<h1>GHOST 游戏库</h1>
<p class="subtitle">欢迎来到游戏大厅 · 选择一款游戏，开始游玩</p>
</header>
<section aria-labelledby="games-title">
<h2 class="section-title" id="games-title">选择游戏</h2>
<div class="games">
<article class="card">
<div class="art" aria-hidden="true">🔫</div>
<span class="tag">恐怖 · 策略 · 联机</span>
<h3>恶魔轮盘</h3>
<p>进入恶魔轮盘游戏。房间联机功能是否可用取决于游戏本身和双方网络。</p>
<div class="actions"><a class="button" href="./roulette/%E6%81%B6%E9%AD%94%E8%BD%AE%E7%9B%98/">▶ 开始游戏</a></div>
</article>
<article class="card">
<div class="art" aria-hidden="true">👻</div>
<span class="tag">恐怖 · 体感</span>
<h3>捉鬼</h3>
<p>用手机相机和转向操作扫描房间，寻找藏在黑暗中的鬼。</p>
<div class="actions"><a class="button secondary" href="./games/%E6%8D%89%E9%AC%BC/">▶ 开始游戏</a></div>
</article>
</div>
</section>
<footer>GHOST GAME LIBRARY · 更多游戏将陆续加入</footer>
</main>
</body>
</html>
