<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090e">
<title>GHOST — 游戏库</title>
<style>
:root{color-scheme:dark;--bg:#09090e;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.09);--tx:#eceaf6;--mu:#8e8ca6;--ac:#9b8cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60rem 40rem at 85% -10%,#4b3fb355,transparent 60%),radial-gradient(50rem 38rem at -10% 30%,#b8456f30,transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:#09090ecc;border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.nb{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.24em;font-size:14px}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#c9bfff,#7a67f0 60%,#e0679a);color:#120f26;font-weight:900;letter-spacing:0;box-shadow:0 6px 24px #7a67f055}
.sp{flex:1}
.search{display:flex;align-items:center;gap:9px;width:min(340px,52vw);height:40px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);transition:.2s}
.search:focus-within{border-color:#9b8cff99;background:var(--s2);box-shadow:0 0 0 4px #9b8cff1f}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}.search input::placeholder{color:var(--mu)}
kbd{font:11px ui-monospace,monospace;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
.hero{position:relative;margin:28px 0 64px;border-radius:30px;overflow:hidden;border:1px solid var(--bd);min-height:420px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:30px;padding:clamp(24px,5vw,56px);isolation:isolate}
.hbg{position:absolute;inset:-60px;z-index:-2;background-size:cover;background-position:center;filter:blur(64px) saturate(1.5) brightness(.55);transform:scale(1.2)}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,#09090ef0 10%,#09090e88 55%,#09090e33),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
.eye{display:inline-flex;gap:8px;align-items:center;font:600 11px ui-monospace,monospace;letter-spacing:.2em;color:#cfc8ff;padding:6px 12px;border:1px solid #ffffff1f;border-radius:999px;background:#ffffff0a}
.eye i{width:6px;height:6px;border-radius:50%;background:#7dffb2;box-shadow:0 0 10px #7dffb2}
.hero h1{font-size:clamp(40px,6.4vw,76px);line-height:1;letter-spacing:-.045em;margin:20px 0 16px;font-weight:800;background:linear-gradient(180deg,#fff,#b9b3da);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#b4b2cb;max-width:46ch;margin:0 0 26px}
.tags{display:flex;gap:7px;flex-wrap:wrap}.tg{font-size:12px;color:#c9c6e0;padding:3px 10px;border-radius:999px;background:var(--s1);border:1px solid var(--bd)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 26px;border-radius:999px;font-weight:700;transition:.25s}
.b1{background:#fff;color:#14112a;box-shadow:0 10px 36px #9b8cff40}.b1:hover{transform:translateY(-2px);box-shadow:0 14px 44px #9b8cff70}
.b2{background:var(--s2);border:1px solid var(--bd)}.b2:hover{background:#ffffff18}
.poster{justify-self:center;width:min(100%,380px);aspect-ratio:1;border-radius:26px;overflow:hidden;border:1px solid #ffffff2a;box-shadow:0 30px 80px #000a,0 0 0 8px #ffffff06;transition:transform .15s}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sh h2{margin:0;font-size:28px;letter-spacing:-.03em}.sh small{color:var(--mu);display:block;font:600 11px ui-monospace,monospace;letter-spacing:.2em;margin-bottom:6px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--bd);background:var(--s1);color:#b4b2cb;cursor:pointer;transition:.2s}
.chip:hover{background:var(--s2);color:#fff}.chip.on{background:#fff;color:#14112a;border-color:#fff;font-weight:700}
select{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);background:#14131d;outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{--mx:50%;--my:0%;position:relative;border-radius:var(--r,22px);border:1px solid var(--bd);background:linear-gradient(160deg,#15141f,#0d0d14);overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s;opacity:0;transform:translateY(14px);animation:up .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes up{to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx) var(--my),#9b8cff2e,transparent 60%)}
.card:hover{transform:translateY(-7px);border-color:#9b8cff66;box-shadow:0 26px 60px #000a,0 0 0 1px #9b8cff22}.card:hover:before{opacity:1}
.cv{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0b0b11}
.cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .cv img{transform:scale(1.07)}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0d0d14 2%,transparent 55%)}
.st{position:absolute;z-index:3;top:14px;left:14px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff22;display:flex;gap:6px;align-items:center}
.st i{width:6px;height:6px;border-radius:50%;background:#7dffb2;box-shadow:0 0 8px #7dffb2}.st.w i{background:#ffc46b;box-shadow:0 0 8px #ffc46b}
.cb{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cb h3{margin:0;font-size:20px;letter-spacing:-.02em}.cb .en{font:11px ui-monospace,monospace;letter-spacing:.14em;color:var(--mu)}
.cb p{margin:0;color:#a3a1ba;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
.go{color:#fff;font-weight:700;display:flex;gap:6px;align-items:center;transition:gap .2s}.card:hover .go{gap:11px;color:#cfc8ff}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--mu);border:1px dashed var(--bd);border-radius:22px}
footer{margin:72px 0 0;padding:28px 0 40px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}.poster{order:-1;width:min(70%,260px)}.kb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<nav><div class="wrap nb"><a class="logo" href="./"><span class="mark">G</span>GHOST</a><span class="sp"></span>
<label class="search"><span>⌕</span><input id="q" type="search" placeholder="搜索游戏…" aria-label="搜索游戏"><kbd class="kb">/</kbd></label></div></nav>
<main class="wrap">
<section class="hero" id="hero" hidden><div class="hbg" id="hbg"></div>
<div><span class="eye"><i></i>FEATURED · 精选</span><h1 id="ht"></h1><p id="hd"></p><div class="tags" id="hg"></div>
<div class="cta"><a class="btn b1" id="hgo" href="#">开始游戏 ↗</a><a class="btn b2" href="#games">浏览全部</a></div></div>
<div class="poster" id="poster"><img id="hi" alt=""></div></section>
<section id="games"><div class="sh"><div><small>LIBRARY</small><h2>游戏库 <span id="n" style="color:var(--mu);font-weight:500"></span></h2></div>
<div class="fl"><span class="fl" id="chips"></span><select id="sort" aria-label="排序"><option value="new">最新加入</option><option value="name">名称</option></select></div></div>
<div class="grid" id="grid"></div><div class="empty" id="empty">没有找到匹配的游戏，换个关键词试试。</div></section>
</main>
<footer class="wrap"><b style="letter-spacing:.2em;color:#b4b2cb">GHOST · GAME LIBRARY</b><span>新增游戏：建一个文件夹 + meta.json，再在 games.json 加一行</span></footer>
<script>
(async()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LIB,tag="all",q="",sort="new";
async function load(){if(window.__LIB)return window.__LIB;const L=await(await fetch("games.json",{cache:"no-cache"})).json();
 const g=(await Promise.all(L.games.map(async p=>{try{const m=await(await fetch(encodeURI(p)+"/meta.json",{cache:"no-cache"})).json();m.path=p;return m}catch(e){console.warn("缺少 meta.json:",p);return null}}))).filter(Boolean);return{tags:L.tags||{},games:g}}
try{LIB=await load()}catch(e){$("#grid").innerHTML='<div class="empty" style="display:block;grid-column:1/-1">游戏列表加载失败。请通过网址访问，不要直接打开本地文件。</div>';return}
LIB.games.forEach(g=>{if(Array.isArray(g.cover))g.cover=g.cover.join("")});
const url=g=>encodeURI(g.path)+"/",tn=t=>LIB.tags[t]||t;
const feat=LIB.games.find(g=>g.featured)||LIB.games[0];
if(feat){$("#hero").hidden=false;$("#hbg").style.backgroundImage=`url("${feat.cover}")`;$("#hi").src=feat.cover;$("#ht").textContent=feat.name;$("#hd").textContent=feat.desc;
 $("#hg").innerHTML=(feat.tags||[]).map(t=>`<span class="tg">${esc(tn(t))}</span>`).join("");$("#hgo").href=url(feat)}
const all=[...new Set(LIB.games.flatMap(g=>g.tags||[]))];
function chips(){$("#chips").innerHTML=[["all","全部"],...all.map(t=>[t,tn(t)])].map(([k,n])=>`<button class="chip${k==tag?" on":""}" data-t="${esc(k)}">${esc(n)}</button>`).join("")}
function render(){const s=q.trim().toLowerCase();let L=LIB.games.filter(g=>(tag=="all"||(g.tags||[]).includes(tag))&&(!s||[g.name,g.en,g.desc,...(g.tags||[]).map(tn)].join(" ").toLowerCase().includes(s)));
 L.sort(sort=="name"?(a,b)=>a.name.localeCompare(b.name,"zh"):(a,b)=>String(b.added||"").localeCompare(String(a.added||"")));
 $("#n").textContent=L.length;$("#empty").style.display=L.length?"none":"block";
 $("#grid").innerHTML=L.map((g,i)=>`<a class="card" style="--i:${i}" href="${url(g)}"><div class="cv"><img src="${g.cover}" alt="${esc(g.name)}" loading="lazy"><span class="st${g.status=="开发中"?" w":""}"><i></i>${esc(g.status||"可玩")}</span></div>
 <div class="cb"><div><h3>${esc(g.name)}</h3><div class="en">${esc(g.en||"")}</div></div><p>${esc(g.desc)}</p><div class="tags">${(g.tags||[]).map(t=>`<span class="tg">${esc(tn(t))}</span>`).join("")}</div>
 <div class="cf"><span>${esc((g.platform||[]).join(" · "))}</span><span class="go">进入 <b>↗</b></span></div></div></a>`).join("");chips()}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){tag=b.dataset.t;render()}};
$("#q").oninput=e=>{q=e.target.value;render()};$("#sort").onchange=e=>{sort=e.target.value;render()};
addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!=$("#q")){e.preventDefault();$("#q").focus()}});
$("#grid").addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")});
const P=$("#poster");P.addEventListener("pointermove",e=>{const r=P.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;P.style.transform=`perspective(800px) rotateY(${x*10}deg) rotateX(${-y*10}deg)`});P.addEventListener("pointerleave",()=>P.style.transform="");
render()})();
</script>
</body>
</html>
