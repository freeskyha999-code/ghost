<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080d">
<title>正在启动游戏 · GHOST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08080d;color:#f4f1ff;font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{overflow:hidden}#stage{position:fixed;inset:0;background:#08080d}#game{width:100%;height:100%;border:0;display:block;background:#08080d}#gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#28213e 0,#100e19 48%,#08080d 100%)}.panel{width:min(460px,100%);padding:32px 26px;text-align:center;border:1px solid #ffffff20;border-radius:24px;background:#11101bcc;box-shadow:0 24px 100px #0009;backdrop-filter:blur(20px)}h1{margin:0 0 10px;font-size:clamp(28px,7vw,42px);line-height:1.15}p{color:#b8b3ce;margin:0 0 24px}.btn{display:block;width:100%;padding:14px 18px;border:0;border-radius:13px;background:#f5f2ff;color:#15111f;font:700 16px system-ui;cursor:pointer}.sub{margin-top:12px;font-size:12px;color:#858099}.top{position:fixed;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.top a,.top button{pointer-events:auto;color:#fff;background:#0b0a12cc;border:1px solid #ffffff24;border-radius:999px;padding:9px 13px;font:600 12px system-ui;text-decoration:none;cursor:pointer;backdrop-filter:blur(12px)}#hint{position:fixed;z-index:3;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:8px 13px;border-radius:999px;background:#0b0a12c9;color:#c6c1d7;font-size:12px;white-space:nowrap;pointer-events:none}#hint[hidden],#gate[hidden]{display:none}
</style>
</head>
<body>
<div id="stage"><iframe id="game" title="游戏画面" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; xr-spatial-tracking" allowfullscreen></iframe></div>
<div class="top"><a href="./">← 返回游戏库</a><button id="fs" type="button">⛶ 全屏</button></div>
<div id="hint" hidden>按 Esc 可退出全屏 · 手机请横屏体验</div>
<div id="gate"><div class="panel"><h1 id="title">正在启动游戏</h1><p>点击开始后将尝试进入全屏模式。若浏览器不允许自动全屏，可使用右上角按钮。</p><button class="btn" id="start" type="button">开始游戏 · 全屏体验 ↗</button><div class="sub">全屏功能受浏览器权限限制；部分手机浏览器可能不支持。</div></div></div>
<script>
(async()=>{
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),path=params.get("game");
if(!path||!/^(games|roulette)\//.test(path)||path.includes("..")){$("#title").textContent="无效的游戏地址";$("#start").textContent="返回游戏库";$("#start").onclick=()=>location.href="./";return}
let meta={name:"GHOST 游戏"};
try{meta=await(await fetch(encodeURI(path)+"/meta.json",{cache:"no-cache"})).json()}catch(e){}
document.title=meta.name+" · GHOST";$("#title").textContent=meta.name||"开始游戏";
const frame=$("#game"),gate=$("#gate"),hint=$("#hint");
async function goFullscreen(){try{if(!document.fullscreenElement)await $("#stage").requestFullscreen({navigationUI:"hide"});return !!document.fullscreenElement}catch(e){return false}}
$("#start").addEventListener("click",async()=>{
gate.hidden=true;frame.src=encodeURI(path)+"/";
const ok=await goFullscreen();hint.hidden=false;
if(!ok){hint.textContent="浏览器未允许全屏；点击右上角「全屏」即可尝试";}
});
$("#fs").addEventListener("click",async()=>{if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}else{const ok=await goFullscreen();hint.hidden=false;if(!ok)hint.textContent="此浏览器不支持全屏或未授权，请使用支持全屏的浏览器";}});
document.addEventListener("fullscreenchange",()=>{$("#fs").textContent=document.fullscreenElement?"⤢ 退出全屏":"⛶ 全屏";});
})();
</script>
</body>
</html>
